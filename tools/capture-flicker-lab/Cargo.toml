[package]
name = "capture-flicker-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
global-hotkey = "0.7.0"
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "01-femtovg-border"
path = "src/bin/01_femtovg_border.rs"

[[bin]]
name = "02-femtovg-masks"
path = "src/bin/02_femtovg_masks.rs"

[[bin]]
name = "03-software-masks"
path = "src/bin/03_software_masks.rs"

[[bin]]
name = "04-win32-gdi"
path = "src/bin/04_win32_gdi.rs"
