[package]
name = "snowshot-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
build = "build.rs"

[dependencies]
slint = "1.17.1"

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.7.0"
image = { version = "0.25", features = ["png"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = { version = "0.15.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snow-shot-annotate = { path = "../../crates/snowshot-annotate" }
snow-shot-capture = { path = "../../crates/snowshot-capture" }
snow-shot-clipboard = { path = "../../crates/snowshot-clipboard" }
snow-shot-ocr = { path = "../../crates/snowshot-ocr" }
snow-shot-scroll = { path = "../../crates/snowshot-scroll" }
snow-shot-window = { path = "../../crates/snowshot-window" }
tokio = { version = "1.47.1", features = ["rt"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate", "xz-static"] }
windows = { version = "0.61.3", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
