[package]
name = "snowshot-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
build = "build.rs"

[dependencies]
slint = "1.17.1"

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.7.0"
rfd = { version = "0.15.4", default-features = false }
snow-shot-capture = { path = "../../crates/snowshot-capture" }
snow-shot-clipboard = { path = "../../crates/snowshot-clipboard" }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
